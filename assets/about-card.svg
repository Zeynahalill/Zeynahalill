<svg width="100%" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#FF36AB"/>
    </linearGradient>
    <radialGradient id="panelGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3a1568"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="352" rx="18" fill="url(#panelGlow)"/>
  <rect x="4" y="4" width="1192" height="352" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.9">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- corner HUD brackets -->
  <g stroke="#B57EDC" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 24,24 L 24,56 M 24,24 L 56,24"/>
    <path d="M 1176,24 L 1176,56 M 1176,24 L 1144,24"/>
    <path d="M 24,336 L 24,304 M 24,336 L 56,336"/>
    <path d="M 1176,336 L 1176,304 M 1176,336 L 1144,336"/>
  </g>

  <!-- avatar ring / identity glyph -->
  <g transform="translate(150,180)" filter="url(#softGlow)">
    <circle r="78" fill="none" stroke="#8A2BE2" stroke-width="2" opacity="0.7"/>
    <circle r="62" fill="none" stroke="#00BFFF" stroke-width="1.4" opacity="0.55" stroke-dasharray="4 6"/>
    <g stroke="#D8B4FE" stroke-width="1.3" opacity="0.9">
      <line x1="-32" y1="-14" x2="0" y2="-30"/>
      <line x1="-32" y1="-14" x2="0" y2="6"/>
      <line x1="-32" y1="28" x2="0" y2="6"/>
      <line x1="0" y1="-30" x2="34" y2="-8"/>
      <line x1="0" y1="6" x2="34" y2="-8"/>
      <line x1="0" y1="6" x2="34" y2="24"/>
    </g>
    <g fill="#D8B4FE">
      <circle cx="-32" cy="-14" r="4"/>
      <circle cx="-32" cy="28" r="4"/>
      <circle cx="0" cy="-30" r="3.4"/>
      <circle cx="0" cy="6" r="5" fill="#00BFFF"/>
      <circle cx="34" cy="-8" r="4"/>
      <circle cx="34" cy="24" r="4" fill="#FF36AB"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="290" y1="50" x2="290" y2="310" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- identity text -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="330" y="100" font-size="14" fill="#8A2BE2" letter-spacing="3">IDENTITY PANEL // AI-ENG-01</text>

    <text x="330" y="150" font-size="46" fill="#D8B4FE" font-weight="bold" filter="url(#textGlow)">ZEYNA HALIL</text>

    <text x="330" y="182" font-size="18" fill="#00BFFF" letter-spacing="2">AI ENGINEER · AUTONOMOUS SYSTEMS</text>

    <line x1="330" y1="200" x2="1150" y2="200" stroke="#8A2BE2" stroke-width="1" opacity="0.4"/>

    <text x="330" y="232" font-size="13" fill="#B57EDC" letter-spacing="2">FOCUS</text>
  </g>

  <!-- focus tag chips -->
  <g font-family="Consolas, monospace" font-size="14">
    <g>
      <rect x="330" y="248" width="140" height="34" rx="17" fill="none" stroke="#8A2BE2" stroke-width="1.4"/>
      <text x="400" y="270" fill="#D8B4FE" text-anchor="middle">LLM Systems</text>
    </g>
    <g>
      <rect x="482" y="248" width="140" height="34" rx="17" fill="none" stroke="#00BFFF" stroke-width="1.4"/>
      <text x="552" y="270" fill="#D8B4FE" text-anchor="middle">AI Agents</text>
    </g>
    <g>
      <rect x="634" y="248" width="160" height="34" rx="17" fill="none" stroke="#FF36AB" stroke-width="1.4"/>
      <text x="714" y="270" fill="#D8B4FE" text-anchor="middle">Multimodal AI</text>
    </g>
    <g>
      <rect x="806" y="248" width="200" height="34" rx="17" fill="none" stroke="#B57EDC" stroke-width="1.4"/>
      <text x="906" y="270" fill="#D8B4FE" text-anchor="middle">Autonomous Systems</text>
    </g>
  </g>

  <text x="330" y="312" font-size="15" fill="#D8B4FE" font-style="italic" opacity="0.85" font-family="Consolas, monospace">
    Building intelligence that perceives, reasons, and acts.
  </text>
</svg>
